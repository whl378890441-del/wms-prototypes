    // --- 2.1 初始 PRD 文档数据（从 JSON 嵌入区读取） ---
    const INITIAL_PRD_DOCS = JSON.parse(document.getElementById('prd-embedded-data')?.textContent || '{}');

    // --- 2.2 全局可拖拽 PRD 悬浮球 ---
    const DraggablePRDMenu = ({ isPrdMode, setIsPrdMode, importPrdData, exportPrdData, embedSave, showToast }) => {
      const [position, setPosition] = useState({ x: -1000, y: -1000 });
      const [isReady, setIsReady] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const dragRef = useRef({ startX: 0, startY: 0, initX: 0, initY: 0, hasMoved: false });

      useEffect(() => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        setPosition({ x: Math.max(10, w - 75), y: Math.max(10, h - 150) });
        setIsReady(true);
      }, []);

      const handlePointerDown = (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current = { startX: e.clientX, startY: e.clientY, initX: position.x, initY: position.y, hasMoved: false };
      };

      const handlePointerMove = (e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
        const dx = e.clientX - dragRef.current.startX;
        const dy = e.clientY - dragRef.current.startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          dragRef.current.hasMoved = true;
          if (!isDragging) setIsDragging(true);
        }
        if (dragRef.current.hasMoved) {
          let newX = dragRef.current.initX + dx;
          let newY = dragRef.current.initY + dy;
          newX = Math.max(0, Math.min(newX, window.innerWidth - 52));
          newY = Math.max(0, Math.min(newY, window.innerHeight - 52));
          setPosition({ x: newX, y: newY });
        }
      };

      const handlePointerUp = (e) => {
        e.currentTarget.releasePointerCapture(e.pointerId);
        setTimeout(() => setIsDragging(false), 10);
      };

      const handleClick = (e) => {
        if (dragRef.current.hasMoved) { e.stopPropagation(); e.preventDefault(); return; }
        setIsPrdMode(!isPrdMode);
        if (showToast) showToast(isPrdMode ? 'PRD 模式已关闭' : 'PRD 模式已开启', 'info');
      };

      useEffect(() => {
        const handleResize = () => {
          setPosition(prev => ({
            x: Math.max(0, Math.min(prev.x, window.innerWidth - 52)),
            y: Math.max(0, Math.min(prev.y, window.innerHeight - 52))
          }));
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      if (!isReady) return null;

      return ReactDOM.createPortal(
        <div className="fixed z-[9999] flex flex-col items-center gap-3 transition-opacity"
          style={{ left: `${position.x}px`, top: `${position.y}px`, touchAction: 'none' }}>
          <div className={`flex items-center justify-center w-[52px] h-[52px] bg-white rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.2)] border-2 ${isPrdMode ? 'border-[#FF9500]' : 'border-transparent'} cursor-pointer select-none transition-transform ${isDragging ? 'scale-95 opacity-90' : 'hover:scale-105'}`}
            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
            onClick={handleClick} title={isPrdMode ? "关闭 PRD 模式" : "开启 PRD 模式"}>
            <i className={`ph-fill ${isPrdMode ? 'ph-notebook text-[#FF9500]' : 'ph-notebook text-[#808592]'} text-[26px] pointer-events-none`}></i>
          </div>
          {isPrdMode && (
            <div className="flex flex-col gap-2 fade-in" onPointerDown={e => e.stopPropagation()}>
              <label className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#3C5BF2] hover:scale-105 transition-transform" title="导入 PRD 配置文件">
                <i className="ph-fill ph-download-simple text-[20px]"></i>
                <input type="file" accept=".json" className="hidden" onChange={importPrdData} />
              </label>
              <div className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#34C759] hover:scale-105 transition-transform" title="导出 PRD 配置文件" onClick={exportPrdData}>
                <i className="ph-fill ph-upload-simple text-[20px]"></i>
              </div>
              <div className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#FF9500] hover:scale-105 transition-transform" title="嵌入保存（直接覆盖原HTML文件）" onClick={embedSave}>
                <i className="ph-fill ph-floppy-disk text-[20px]"></i>
              </div>
            </div>
          )}
        </div>,
        document.body
      );

    // --- 2.3 富文本编辑器 ---
    const RichTextEditor = ({ value, onChange, activeId }) => {
      const editorRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && editorRef.current.innerHTML !== value) {
          editorRef.current.innerHTML = value || '';
        }
      }, [activeId]);

      const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };

      const execCmd = (cmd, arg = null) => {
        document.execCommand(cmd, false, arg);
        editorRef.current.focus();
        handleInput();
      };

      const insertTable = () => {
        editorRef.current.focus();
        document.execCommand('insertHTML', false,
          `<table style="width: 100%; border-collapse: collapse;"><tbody>
            <tr><td>表头1</td><td>表头2</td></tr>
            <tr><td>内容</td><td>内容</td></tr>
          </tbody></table><p><br></p>`);
        handleInput();
      };
      const getCell = () => {
        const sel = window.getSelection();
        if (!sel.rangeCount) return null;
        let n = sel.anchorNode;
        while (n && n !== editorRef.current) { if (n.nodeType === 1 && (n.tagName === 'TD' || n.tagName === 'TH')) return n; n = n.parentNode; }
        return null;
      };
      const insertRow = (above) => {
        const cell = getCell(); if (!cell) return;
        const row = cell.parentElement; const tbody = row.parentElement;
        const newRow = row.cloneNode(true);
        newRow.querySelectorAll('td,th').forEach(c => { c.innerHTML = ''; });
        above ? tbody.insertBefore(newRow, row) : tbody.insertBefore(newRow, row.nextSibling);
        handleInput();
      };
      const insertCol = (left) => {
        const cell = getCell(); if (!cell) return;
        const idx = Array.from(cell.parentElement.children).indexOf(cell);
        cell.closest('table').querySelectorAll('tr').forEach(tr => {
          const ref = tr.children[idx];
          const newCell = ref ? ref.cloneNode(true) : document.createElement('td');
          newCell.innerHTML = '';
          left && ref ? tr.insertBefore(newCell, ref) : tr.appendChild(newCell);
        });
        handleInput();
      };
      const deleteRow = () => {
        const cell = getCell(); if (!cell) return;
        const row = cell.parentElement; const tbody = row.parentElement;
        if (tbody.children.length <= 1) return;
        row.remove(); handleInput();
      };
      const deleteCol = () => {
        const cell = getCell(); if (!cell) return;
        const idx = Array.from(cell.parentElement.children).indexOf(cell);
        const table = cell.closest('table');
        table.querySelectorAll('tr').forEach(tr => { if (tr.children[idx]) tr.children[idx].remove(); });
        handleInput();
      };

      return (
        <div className="border border-[#E8E8E8] rounded-lg overflow-hidden flex flex-col flex-1 bg-white shadow-sm">
          <div className="flex items-center gap-1.5 p-1.5 border-b border-[#E8E8E8] bg-[#F9FAFB] flex-shrink-0 flex-wrap">
            <button onClick={() => execCmd('bold')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="加粗"><b className="font-serif text-[15px]">B</b></button>
            <button onClick={() => execCmd('italic')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="斜体"><i className="font-serif text-[15px]">I</i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={() => execCmd('insertUnorderedList')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="无序列表"><i className="ph ph-list-bullets text-[16px]"></i></button>
            <button onClick={() => execCmd('insertOrderedList')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="有序列表"><i className="ph ph-list-numbers text-[16px]"></i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={insertTable} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="插入表格"><i className="ph ph-table text-[16px]"></i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={() => insertRow(true)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="上方插入行">+↑</button>
            <button onClick={() => insertRow(false)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="下方插入行">+↓</button>
            <button onClick={() => insertCol(true)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="左侧插入列">+←</button>
            <button onClick={() => insertCol(false)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="右侧插入列">+→</button>
            <button onClick={deleteRow} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#EF4444] transition-colors text-[11px] font-bold" title="删除当前行">-行</button>
            <button onClick={deleteCol} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#EF4444] transition-colors text-[11px] font-bold" title="删除当前列">-列</button>
          </div>
          <div ref={editorRef} className="flex-1 p-3 outline-none overflow-y-auto text-[14px] leading-relaxed rich-text-content text-[#353D51]"
            contentEditable onInput={handleInput} style={{ minHeight: '180px' }} />
        </div>
      );
    };

    // --- 2.4 PRD Context ---
    const PrdContext = React.createContext();

    // --- 2.5 PrdWrapper ---
    const PrdBadge = ({ order, anchorRef }) => {
      const [pos, setPos] = useState(null);

      useEffect(() => {
        const update = () => {
          const el = anchorRef?.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            setPos({ x: rect.right - 10, y: rect.top - 10 });
          }
        };
        update();
        const timer = setTimeout(update, 100);
        window.addEventListener('scroll', update, true);
        window.addEventListener('resize', update);
        return () => { clearTimeout(timer); window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
      }, [anchorRef]);

      if (!pos) return null;
      return ReactDOM.createPortal(
        <div className="fixed w-[22px] h-[22px] bg-[#FF9500] text-white text-[11px] font-bold rounded-full flex items-center justify-center shadow-[0_2px_6px_rgba(255,149,0,0.5)] z-[9998] pointer-events-none"
          style={{ left: `${pos.x}px`, top: `${pos.y}px` }}>
          {order}
        </div>,
        document.body
      );
    };

    const PrdWrapper = ({ id, children, className = "" }) => {
      const { prdDocs, isPrdMode, openPrdDrawer, drawerOpen } = React.useContext(PrdContext);
      const anchorRef = useRef(null);
      const docData = prdDocs[id];
      const hasContent = docData && (docData.title || docData.content);

      if (!isPrdMode) return <div className={className}>{children}</div>;

      return (
        <div ref={anchorRef} className={`relative ring-2 ring-transparent hover:ring-[#FF9500] hover:bg-[rgba(255,149,0,0.05)] transition-all rounded-lg cursor-pointer ${className}`}
          onClickCapture={(e) => { e.preventDefault(); e.stopPropagation(); openPrdDrawer(id); }}>
          <div className="absolute inset-0 z-50"></div>
          {children}
          {hasContent && !drawerOpen && <PrdBadge order={docData.order} anchorRef={anchorRef} />}
        </div>
      );
    };

    const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
    const BadgePillBar = ({ badges, activeId, onSelect, scrollRef }) => {
      const scrollContainerRef = useRef(null);
      const [showLeft, setShowLeft] = useState(false);
      const [showRight, setShowRight] = useState(false);

      const checkOverflow = () => {
        const el = scrollContainerRef.current;
        if (!el) return;
        setShowLeft(el.scrollLeft > 2);
        setShowRight(el.scrollWidth > el.clientWidth && el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
      };

      useEffect(() => { checkOverflow(); }, [badges]);

      const scroll = (dir) => {
        const el = scrollContainerRef.current;
        if (!el) return;
        el.scrollBy({ left: dir * 120, behavior: 'smooth' });
        setTimeout(checkOverflow, 200);
      };

      useEffect(() => { if (scrollRef) scrollRef.current = scrollContainerRef.current; }, []);

      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '8px 16px', background: '#fff', borderBottom: '1px solid #e5e7eb', flexShrink: 0 }}>
          <div className={`badge-arrow ${showLeft ? '' : 'hidden'}`} onClick={() => scroll(-1)}>◀</div>
          <div ref={scrollContainerRef} className="badge-pill-scroll" onScroll={checkOverflow}>
            {badges.map(b => (
              <div key={b.id} className={`badge-pill ${b.id === activeId ? 'active' : ''}`} onClick={() => onSelect(b.id)}>
                {CIRCLED_NUMS[b.order - 1] || b.order}
              </div>
            ))}
          </div>
          <div className={`badge-arrow ${showRight ? '' : 'hidden'}`} onClick={() => scroll(1)}>▶</div>
        </div>
      );
    };

    // --- 主应用组件 ---
    function App() {
      const [activeTab, setActiveTab] = useState('列表');
      const [showPrintModal, setShowPrintModal] = useState(false);

      const today = useMemo(() => new Date(), []);
      const formattedToday = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      // 详情页表单状态
      const [formData, setFormData] = useState({
        danJu: '20260428-1',
        shouGong: '',
        danJuRiQi: formattedToday,
        danJuLeiXing: '采购到货通知单',
        guanLianDanHao: '',
        gongYingShang: '',
        faHuoQuDao: '',
        shouHuoQuDao: '',
        xiangShu: '',
        caoZuoRen: 'admin',
        beiZhu: ''
      });

      // --- PRD 模式状态 ---
      const [isPrdMode, setIsPrdMode] = useState(false);
      const [activePrdId, setActivePrdId] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [prdDrawerWidth, setPrdDrawerWidth] = useState(560);
      const [isResizing, setIsResizing] = useState(false);
      const resizeRef = useRef(null);
      const badgePillScrollRef = useRef(null);
      const [editingDoc, setEditingDoc] = useState(null);
      const [isEditing, setIsEditing] = useState(false);
      const [showDiscardConfirm, setShowDiscardConfirm] = useState(false);
      const [isConfirmingDelete, setIsConfirmingDelete] = useState(false);

      const [prdDocs, setPrdDocs] = useState(INITIAL_PRD_DOCS);

      // --- 简单的 Toast 提示函数 ---
      const showToast = (msg, type = 'info') => {
        let container = document.getElementById('prd-toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'prd-toast-container';
          container.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[10000] flex flex-col gap-2 pointer-events-none';
          document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        const bgColors = {
          success: 'bg-[#34C759]',
          error: 'bg-[#FF3B30]',
          info: 'bg-[#007AFF]'
        };
        toast.className = `px-4 py-2 text-white text-[13px] rounded-lg shadow-lg ${bgColors[type] || bgColors.info} transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-1.5`;
        toast.innerHTML = `<i class="ph ph-info text-[16px]"></i><span>${msg}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
          toast.className = toast.className.replace('translate-y-[-20px] opacity-0', 'translate-y-0 opacity-100');
        }, 10);
        
        setTimeout(() => {
          toast.className = toast.className.replace('translate-y-0 opacity-100', 'translate-y-[-20px] opacity-0');
          setTimeout(() => { toast.remove(); }, 300);
        }, 2500);
      };

      // --- 导入/导出 ---
      const exportPrdData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(prdDocs, null, 2));
        const a = document.createElement('a');
        a.href = dataStr; a.download = "预收单WEB_PRD数据.json";
        document.body.appendChild(a); a.click(); a.remove();
        showToast('已导出 PRD 数据文件', 'success');
      };

      const importPrdData = (event) => {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (typeof imported === 'object' && imported !== null) {
              setPrdDocs(imported);
              showToast('PRD 数据导入成功', 'success');
            } else { showToast('无效的数据文件格式', 'error'); }
          } catch (error) { showToast('文件解析失败', 'error'); }
        };
        reader.readAsText(file); event.target.value = null;
      };

      // --- 抽屉操作（含编辑状态控制） ---
      const openPrdDrawer = (id) => {
        setActivePrdId(id); setIsConfirmingDelete(false);
        if (prdDocs[id]) { setEditingDoc({ ...prdDocs[id] }); setIsEditing(false); }
        else {
          const orders = Object.values(prdDocs).map(d => d.order);
          setEditingDoc({ order: orders.length > 0 ? Math.max(...orders) + 1 : 1, title: '', content: '' });
          setIsEditing(true);
        }
        setDrawerOpen(true);
      };

      const hasUnsavedChanges = () => {
        if (!editingDoc) return false;
        const existing = prdDocs[activePrdId];
        return !existing || existing.title !== editingDoc.title || existing.content !== editingDoc.content;
      };

      const closePrdDrawer = () => {
        if (isEditing && hasUnsavedChanges()) { setShowDiscardConfirm(true); return; }
        setDrawerOpen(false); setIsEditing(false); setShowDiscardConfirm(false); setIsConfirmingDelete(false);
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

      const discardChanges = () => {
        setDrawerOpen(false); setIsEditing(false); setShowDiscardConfirm(false); setIsConfirmingDelete(false);
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

      const executeDelete = () => {
        let nd = { ...prdDocs }; delete nd[activePrdId];
        let c = 1; const sorted = Object.keys(nd).sort((a, b) => nd[a].order - nd[b].order);
        const rebuilt = {}; sorted.forEach(k => { rebuilt[k] = { ...nd[k], order: c++ }; });
        setPrdDocs(rebuilt);
        setIsConfirmingDelete(false); showToast('已删除该角标说明', 'success');
        if (sorted.length > 0) {
          const nextId = sorted[0];
          setActivePrdId(nextId); setEditingDoc({ ...rebuilt[nextId] }); setIsEditing(false);
        } else {
          setDrawerOpen(false); setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
        }
      };

      const confirmPrdSave = () => {
        let nd = { ...prdDocs };
        if (!editingDoc.title?.trim() && !editingDoc.content?.trim()) {
          delete nd[activePrdId];
          let c = 1; const sorted = Object.keys(nd).sort((a, b) => nd[a].order - nd[b].order);
          const rebuilt = {}; sorted.forEach(k => { rebuilt[k] = { ...nd[k], order: c++ }; }); nd = rebuilt;
        } else { nd[activePrdId] = editingDoc; }
        setPrdDocs(nd);
        setDrawerOpen(false); showToast('保存成功，请点击悬浮球【嵌入保存】以固化到文件', 'success');
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

      const embedSave = async () => {
        if (typeof window.showOpenFilePicker !== 'function') {
          showToast('当前浏览器不支持直接覆盖，请使用导出功能', 'error');
          return;
        }
        try {
          const [fileHandle] = await window.showOpenFilePicker({
            types: [{ description: 'HTML 文件', accept: { 'text/html': ['.html', '.htm'] } }],
            multiple: false
          });
          const file = await fileHandle.getFile();
          const fileContent = await file.text();
          const jsonStartTag = '<script type="application/json" id="prd-embedded-data">';
          const jsonEndTag = '<' + '/script>';
          let jsonStart = -1;
          let searchPos = 0;
          while (true) {
            const idx = fileContent.indexOf(jsonStartTag, searchPos);
            if (idx === -1) break;
            const afterTag = fileContent.substring(idx + jsonStartTag.length, idx + jsonStartTag.length + 10).trim();
            if (afterTag.startsWith('{')) { jsonStart = idx; break; }
            searchPos = idx + 1;
          }
          if (jsonStart === -1) { showToast('选中文件缺少 PRD 嵌入区', 'error'); return; }
          const jsonEnd = fileContent.indexOf(jsonEndTag, jsonStart);
          if (jsonEnd === -1) { showToast('PRD 嵌入区格式异常', 'error'); return; }
          const jsonStr = JSON.stringify(prdDocs, null, 2);
          const before = fileContent.substring(0, jsonStart + jsonStartTag.length);
          const after = fileContent.substring(jsonEnd);
          const newContent = before + '\n' + jsonStr + '\n' + after;
          const writable = await fileHandle.createWritable();
          await writable.write(newContent);
          await writable.close();
          showToast('原文件已成功覆盖更新', 'success');
        } catch (error) {
          if (error.name !== 'AbortError') {
            showToast('嵌入保存失败: ' + error.message, 'error');
            console.error('Save failed:', error);
          }
        }
      };

      const handlePrdChange = (field, value) => setEditingDoc(prev => ({ ...prev, [field]: value }));

      const startResize = (e) => {
        e.preventDefault();
        setIsResizing(true);
        document.body.classList.add('prd-resizing');
        resizeRef.current = { startX: e.clientX, startWidth: prdDrawerWidth };
        const onMove = (ev) => {
          const dx = resizeRef.current.startX - ev.clientX;
          const newWidth = Math.max(360, Math.min(900, resizeRef.current.startWidth + dx));
          setPrdDrawerWidth(newWidth);
        };
        const onUp = () => {
          setIsResizing(false);
          document.body.classList.remove('prd-resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      // 方法提取 (关联单号选择后带出对应不可编辑字段)
      const handleGuanLianDanHaoChange = (e) => {
        const val = e.target.value;
        if (ASSOCIATED_ORDERS[val]) {
          const matched = ASSOCIATED_ORDERS[val];
          setFormData(prev => ({
            ...prev,
            guanLianDanHao: val,
            gongYingShang: matched.gongYingShangBianHao ? `${matched.gongYingShangBianHao}-${matched.gongYingShangJianCheng}` : '',
            faHuoQuDao: matched.faHuoQuDaoBianHao ? `${matched.faHuoQuDaoBianHao}-${matched.faHuoQuDaoJianCheng}` : '',
            shouHuoQuDao: matched.shouHuoQuDaoBianHao ? `${matched.shouHuoQuDaoBianHao}-${matched.shouHuoQuDaoJianCheng}` : ''
          }));
        } else {
          setFormData(prev => ({
            ...prev,
            guanLianDanHao: val,
            gongYingShang: '',
            faHuoQuDao: '',
            shouHuoQuDao: ''
          }));
        }
      };

      return (
        <PrdContext.Provider value={{ prdDocs, isPrdMode, openPrdDrawer, drawerOpen }}>
          <div className="flex flex-col h-screen w-full bg-[#f0f2f5] font-sans text-[13px] text-gray-800 overflow-hidden relative">
            
            {/* 悬浮球 */}
            <DraggablePRDMenu
              isPrdMode={isPrdMode} setIsPrdMode={setIsPrdMode}
              importPrdData={importPrdData} exportPrdData={exportPrdData}
              embedSave={embedSave} showToast={showToast}
            />

            {/* PRD 抽屉 Portal（放在所有业务 Modals 之前） */}
            {ReactDOM.createPortal(
              <>
                <div className={`fixed inset-0 bg-black/40 z-[9990] transition-opacity duration-300 ${drawerOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                  onClick={closePrdDrawer}></div>
                <div className={`fixed right-0 top-0 bottom-0 bg-[#F5F5F7] shadow-2xl z-[9995] transition-transform duration-300 transform flex flex-col ${drawerOpen ? 'translate-x-0' : 'translate-x-full'}`}
                  style={{ width: `${prdDrawerWidth}px`, maxWidth: '90vw' }}>
                  {/* 左侧拖拽拉伸手柄 */}
                  <div className="absolute left-0 top-0 bottom-0 w-1.5 cursor-col-resize z-10 hover:bg-[#FF9500] hover:opacity-60 transition-opacity group"
                    onMouseDown={startResize}>
                    <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1 w-1 h-12 bg-gray-300 rounded-full group-hover:bg-[#FF9500] transition-colors"></div>
                  </div>
                  <div className="px-6 py-4 border-b border-[#E8E8E8] bg-white flex items-center justify-between flex-shrink-0">
                    <span className="text-[18px] font-semibold text-[#333]">产品规则说明</span>
                    <div className="w-8 h-8 rounded-full bg-[#F5F5F7] flex items-center justify-center cursor-pointer active:scale-95 hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>
                      <i className="ph ph-x text-[16px] text-[#666]"></i>
                    </div>
                  </div>
                  <BadgePillBar
                    badges={Object.keys(prdDocs).map(id => ({ id, order: prdDocs[id].order })).sort((a, b) => a.order - b.order)}
                    activeId={activePrdId}
                    onSelect={(id) => {
                      setActivePrdId(id); setIsConfirmingDelete(false);
                      if (prdDocs[id]) { setEditingDoc({ ...prdDocs[id] }); setIsEditing(false); }
                    }}
                    scrollRef={badgePillScrollRef}
                  />
                  <div className="flex-1 p-6 overflow-y-auto flex flex-col gap-6">
                    {/* ===== 标题字段：只读态与编辑态样式必须一致 ===== */}
                    <div className="flex flex-col gap-2 flex-shrink-0">
                      <label className="text-[14px] font-medium text-[#808592] ml-1">功能模块名称</label>
                      {isEditing ? (
                        <input className="px-4 py-3 text-[15px] border border-[#E8E8E8] rounded-xl outline-none focus:border-[#FF9500] focus:ring-2 focus:ring-[rgba(255,149,0,0.1)] bg-white font-medium text-[#353D51] transition-all"
                          value={editingDoc?.title || ''} onChange={e => handlePrdChange('title', e.target.value)} />
                      ) : (
                        <div className="px-4 py-3 text-[15px] border border-[#E8E8E8] rounded-xl bg-white font-medium text-[#353D51] min-h-[48px]">
                          {editingDoc?.title || '未命名'}
                        </div>
                      )}
                    </div>
                    {/* ===== 内容区域：只读态与编辑态样式必须一致 ===== */}
                    <div className="flex flex-col gap-2 flex-1 min-h-[300px]">
                      <label className="text-[14px] font-medium text-[#808592] ml-1">交互与规则说明（富文本）</label>
                      {isEditing ? (
                        <RichTextEditor value={editingDoc?.content || ''} onChange={val => handlePrdChange('content', val)} activeId={activePrdId} />
                      ) : (
                        <div className="flex-1 p-3 border border-[#E8E8E8] rounded-lg bg-white shadow-sm overflow-y-auto rich-text-content text-[14px] leading-relaxed text-[#353D51]"
                          dangerouslySetInnerHTML={{ __html: editingDoc?.content || '' }} />
                      )}
                    </div>
                  </div>
                  <div className="px-6 py-4 border-t border-[#E8E8E8] bg-white flex items-center justify-between flex-shrink-0">
                    {isEditing ? (
                       <>{/* 编辑态：左侧删除/放弃，右侧取消+保存 */}
                         {showDiscardConfirm ? (
                           <div className="flex items-center gap-2 fade-in">
                             <span className="text-[13px] font-medium text-orange-500">有未保存的内容</span>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setShowDiscardConfirm(false)}>返回编辑</button>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={discardChanges}>放弃修改</button>
                           </div>
                         ) : isConfirmingDelete ? (
                           <div className="flex items-center gap-2 fade-in">
                             <span className="text-[13px] font-medium text-[#FF3B30]">确认删除？</span>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setIsConfirmingDelete(false)}>取消</button>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={executeDelete}>删除</button>
                           </div>
                         ) : prdDocs[activePrdId] ? (
                           <button className="flex items-center text-[15px] font-medium text-[#FF3B30] active:scale-95 transition-transform px-2 py-2 rounded-lg hover:bg-[rgba(255,59,48,0.08)]" onClick={() => setIsConfirmingDelete(true)}>
                             <i className="ph-fill ph-trash mr-1.5 text-[18px]"></i> 删除
                           </button>
                         ) : <div></div>}
                         <div className="flex items-center gap-3">
                           <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-[#353D51] bg-[#F5F5F7] hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>取消</button>
                           <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-white shadow-md active:scale-95 transition-transform" style={{ background: '#FF9500' }} onClick={confirmPrdSave}>保存</button>
                         </div>
                       </>
                    ) : (
                       <>{/* 只读态：左侧删除，右侧关闭+编辑 */}
                         {prdDocs[activePrdId] && !isConfirmingDelete ? (
                           <button className="flex items-center text-[15px] font-medium text-[#FF3B30] active:scale-95 transition-transform px-2 py-2 rounded-lg hover:bg-[rgba(255,59,48,0.08)]" onClick={() => setIsConfirmingDelete(true)}>
                             <i className="ph-fill ph-trash mr-1.5 text-[18px]"></i> 删除
                           </button>
                         ) : isConfirmingDelete ? (
                           <div className="flex items-center gap-2 fade-in">
                             <span className="text-[13px] font-medium text-[#FF3B30]">确认删除？</span>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setIsConfirmingDelete(false)}>取消</button>
                             <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={executeDelete}>删除</button>
                           </div>
                         ) : <div></div>}
                         <div className="flex items-center gap-3">
                           <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-[#353D51] bg-[#F5F5F7] hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>关闭</button>
                           <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-white shadow-md active:scale-95 transition-transform" style={{ background: '#FF9500' }} onClick={() => setIsEditing(true)}>
                             <i className="ph-fill ph-note-pencil mr-1 text-[16px]"></i>编辑
                           </button>
                         </div>
                       </>
                    )}
                  </div>
                </div>
              </>,
              document.body
            )}

            {/* 打印预览弹窗 */}
            {showPrintModal && activeTab === '详情' && (
              <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center backdrop-blur-sm">
                <PrdWrapper id="print-modal">
                  <div className="bg-white w-[640px] rounded shadow-xl flex flex-col overflow-hidden max-h-[90vh] relative z-10">
                    <div className="px-5 py-3 border-b border-gray-200 flex justify-between items-center bg-white shrink-0">
                      <h2 className="text-[15px] font-bold text-gray-800 flex items-center">
                        <Printer size={16} className="mr-2 text-gray-600" /> 打印预览：预收单
                      </h2>
                      <X size={18} className="cursor-pointer text-gray-400 hover:text-gray-600" onClick={() => setShowPrintModal(false)} />
                    </div>
                    
                    <div className="p-8 overflow-y-auto bg-[#f0f2f5] flex-1">
                       <div className="bg-white p-8 shadow-sm border border-gray-200 mx-auto h-fit print-container">
                          <h3 className="text-center text-[22px] font-bold tracking-[0.2em] mb-4">预收单详情单</h3>
                          <div className="h-[3px] bg-black mb-6"></div>
                          
                          <div className="grid grid-cols-2 gap-y-4 gap-x-8 text-[14px]">
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">单据编号：</span><span className="font-medium text-black break-all">{formData.danJu}</span></div>
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">手工单号：</span><span className="font-medium text-black break-all">{formData.shouGong || '-'}</span></div>
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">单据类型：</span><span className="font-medium text-black">{formData.danJuLeiXing || '-'}</span></div>
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">单据日期：</span><span className="font-medium text-black">{formData.danJuRiQi || '-'}</span></div>
                             
                             {formData.danJuLeiXing === '发货单' ? (
                               <div className="flex items-baseline col-span-2"><span className="text-gray-500 w-[72px] shrink-0">发货渠道：</span><span className="font-medium text-black">{formData.faHuoQuDao || '-'}</span></div>
                             ) : (
                               <div className="flex items-baseline col-span-2"><span className="text-gray-500 w-[72px] shrink-0">供应商：</span><span className="font-medium text-black">{formData.gongYingShang || '-'}</span></div>
                             )}
                             <div className="flex items-baseline col-span-2"><span className="text-gray-500 w-[72px] shrink-0">收货渠道：</span><span className="font-medium text-black">{formData.shouHuoQuDao || '-'}</span></div>
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">关联单号：</span><span className="font-medium text-black break-all">{formData.guanLianDanHao || '-'}</span></div>
                             <div className="flex items-baseline"><span className="text-gray-500 w-[72px] shrink-0">操作人：</span><span className="font-medium text-black">{formData.caoZuoRen}</span></div>
                          </div>

                          <div className="border-t border-dashed border-gray-300 my-6"></div>
                          
                          <div className="grid grid-cols-2 gap-y-4 gap-x-8 text-[14px]">
                            <div className="flex items-baseline col-span-2"><span className="text-gray-500 w-[72px] shrink-0">附件信息：</span><span className="font-medium text-black">详见系统附件</span></div>
                            
                            <div className="flex items-start col-span-2">
                               <span className="text-gray-500 w-[72px] shrink-0">备注内容：</span>
                               <span className="font-medium text-black min-h-[40px] whitespace-pre-wrap">{formData.beiZhu || '无'}</span>
                            </div>
                          </div>
                       </div>
                    </div>
                    
                    <div className="px-5 py-4 border-t border-gray-200 flex justify-end items-center bg-white shrink-0">
                      <div className="flex space-x-3">
                        <button 
                          onClick={() => setShowPrintModal(false)} 
                          className="px-6 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 transition-colors text-[13px]"
                        >
                          取消
                        </button>
                        <button 
                          onClick={() => {
                            alert("在此执行系统真实打印指令");
                            setShowPrintModal(false);
                          }} 
                          className="px-6 py-2 bg-[#0088ff] text-white rounded hover:bg-[#0077ee] transition-colors shadow-sm flex items-center text-[13px]"
                        >
                          <Printer size={16} className="mr-1.5" /> 确认打印
                        </button>
                      </div>
                    </div>
                  </div>
                </PrdWrapper>
              </div>
            )}

            {/* Top Header */}
            <PrdWrapper id="header">
              <header className="h-[50px] bg-[#1e2329] text-gray-300 flex items-center justify-between px-4 shrink-0 relative z-10">
                <div className="flex items-center">
                  <div className="flex items-center mr-8 text-white">
                    <div className="w-6 h-6 rounded-full border-[2px] border-white border-dashed mr-2 flex items-center justify-center">
                       <div className="w-2 h-2 bg-white rounded-full"></div>
                    </div>
                    <span className="font-bold text-lg tracking-wider">NEBULA</span>
                  </div>
                  <nav className="flex space-x-1">
                    {['首页', '零售', '分销', '全渠道', '商品', '会员', '营销', '供应链', '物流', '结算', '更多'].map((item, idx) => (
                      <a key={item} href="#" className={`px-4 py-1.5 rounded-sm hover:text-white transition-colors ${idx === 7 ? 'text-white' : ''}`}>
                        {item}
                      </a>
                    ))}
                  </nav>
                </div>
                <div className="flex items-center space-x-5 text-gray-400">
                  <Search size={16} className="cursor-pointer hover:text-white" />
                  <Maximize size={16} className="cursor-pointer hover:text-white" />
                  <Globe size={16} className="cursor-pointer hover:text-white" />
                  <HelpCircle size={16} className="cursor-pointer hover:text-white" />
                  <Bell size={16} className="cursor-pointer hover:text-white" />
                  <div className="flex items-center space-x-2 cursor-pointer hover:text-white">
                    <div className="w-6 h-6 bg-gray-500 rounded-full flex items-center justify-center text-white">
                      <User size={14} />
                    </div>
                    <span className="text-sm">admin</span>
                  </div>
                </div>
              </header>
            </PrdWrapper>

            {/* Main Body */}
            <div className="flex flex-1 overflow-hidden">
              
              {/* Left Sidebar */}
              <PrdWrapper id="sidebar">
                <aside className="w-[180px] bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 relative">
                  <div className="p-2 border-b border-gray-100">
                    <div className="relative">
                      <input 
                        type="text" 
                        placeholder="请输入" 
                        className="w-full h-8 pl-2 pr-8 border border-gray-300 rounded-sm text-xs focus:outline-none focus:border-blue-500"
                      />
                      <Search size={14} className="absolute right-2 top-2 text-gray-400" />
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto">
                    <SidebarItem icon={<LayoutDashboard size={14} />} label="看板模块" />
                    <SidebarItem icon={<MenuIcon size={14} />} label="系统管理" />
                    <SidebarGroup label="入库管理" active>
                      <SidebarSubItem label="采购入库单" />
                      <SidebarSubItem label="预收单" active />
                      <SidebarSubItem label="调拨入库单" />
                      <SidebarSubItem label="退货入库单" />
                    </SidebarGroup>
                    <SidebarGroup label="出库管理" />
                    <SidebarGroup label="库存管理" />
                  </div>
                </aside>
              </PrdWrapper>

              {/* Right Content Area */}
              <main className="flex-1 flex flex-col min-w-0 bg-white">
                
                {/* Main Tabs */}
                <div className="h-[40px] bg-[#f0f2f5] flex items-end px-2 border-b border-gray-200 shrink-0 select-none">
                  <div className="flex items-center h-[32px] px-3 border border-b-0 border-gray-200 rounded-t-sm bg-gray-50 mr-1 text-gray-600 cursor-pointer">
                    <LayoutDashboard size={14} className="mr-1.5" />
                    <span>首页</span>
                    <X size={12} className="ml-4 text-gray-400 hover:text-gray-600" />
                  </div>
                  <div className="flex items-center h-[32px] px-3 border border-b-0 border-blue-100 rounded-t-sm bg-white text-[#1677ff] cursor-pointer relative z-10 before:content-[''] before:absolute before:bottom-[-1px] before:left-0 before:right-0 before:h-[2px] before:bg-white">
                    <span>预收单</span>
                    <X size={12} className="ml-4 hover:text-blue-800" />
                  </div>
                  <div className="flex-1 border-b border-gray-200 h-full"></div>
                  <div className="flex items-center px-2 border-b border-gray-200 h-full text-gray-400 cursor-pointer hover:text-gray-600">
                     <ChevronDown size={14} />
                  </div>
                </div>

                {/* Inner Content Card */}
                <div className="flex-1 overflow-hidden flex flex-col bg-white">
                  
                  {/* Sub Tabs (列表 / 详情) */}
                  <div className="flex border-b border-gray-100 text-[14px] shrink-0">
                    <div 
                      className={`py-2.5 px-6 cursor-pointer ${activeTab === '列表' ? 'text-[#1677ff] border-b-2 border-[#1677ff] font-medium' : 'text-gray-500 hover:text-blue-600'}`}
                      onClick={() => setActiveTab('列表')}
                    >
                      列表
                    </div>
                    <div 
                      className={`py-2.5 px-6 cursor-pointer ${activeTab === '详情' ? 'text-[#1677ff] border-b-2 border-[#1677ff] font-medium' : 'text-gray-500 hover:text-blue-600'}`}
                      onClick={() => setActiveTab('详情')}
                    >
                      详情
                    </div>
                  </div>

                  {/* 动态渲染对应视图 */}
                  {activeTab === '列表' && <ListView setActiveTab={setActiveTab} />}
                  {activeTab === '详情' && (
                    <DetailView 
                      formData={formData} 
                      setFormData={setFormData} 
                      handleGuanLianDanHaoChange={handleGuanLianDanHaoChange}
                      setShowPrintModal={setShowPrintModal}
                    />
                  )}

                </div>
              </main>
            </div>
          </div>
        </PrdContext.Provider>
      );
    }

    // ---------------- 辅助通用 UI 组件 ----------------

    function SidebarItem({ icon, label }) {
      return (
        <div className="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 cursor-pointer">
          <div className="w-5 flex items-center justify-center mr-2 opacity-60 border border-gray-300 rounded-[2px] bg-white h-5">
             <div className="w-3 h-3 bg-gray-200 opacity-50"></div>
          </div>
          <span className="flex-1">{label}</span>
        </div>
      );
    }

    function SidebarGroup({ label, active, children }) {
      return (
        <div>
          <div className="flex items-center px-4 py-2.5 text-gray-700 cursor-pointer bg-gray-50 border-y border-gray-100">
            <div className="w-5 flex items-center justify-center mr-2 opacity-60 border border-gray-300 rounded-[2px] bg-white h-5">
               <div className="w-3 h-3 bg-gray-200 opacity-50"></div>
            </div>
            <span className="flex-1 font-medium">{label}</span>
            {active ? <ChevronDown size={14} className="text-gray-400" /> : <ChevronRight size={14} className="text-gray-400" />}
          </div>
          {active && (
            <div className="bg-white">
              {children}
            </div>
          )}
        </div>
      );
    }

    function SidebarSubItem({ label, active }) {
      return (
        <div className={`flex items-center pl-11 pr-4 py-2 cursor-pointer text-[13px] ${active ? 'text-blue-600 bg-blue-50 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
          <span className="flex-1">{label}</span>
        </div>
      );
    }

    function ListFilterInput({ placeholder, isSearch }) {
      return (
        <div className="flex items-center border border-gray-300 rounded-sm bg-white h-[28px] w-[180px] overflow-hidden group hover:border-blue-400 transition-colors">
          <input type="text" placeholder={placeholder} className="w-full h-full text-[12px] px-2 focus:outline-none placeholder-gray-500" />
          {isSearch && <Search size={14} className="text-gray-400 mx-2 shrink-0 group-hover:text-blue-400 cursor-pointer" />}
        </div>
      );
    }

    function ListSelectFilter({ label, options }) {
      return (
        <div className="flex items-center border border-gray-300 rounded-sm bg-white h-[28px] w-[180px] hover:border-blue-400 transition-colors relative">
          <div className="px-2 text-gray-500 text-[12px] shrink-0">{label}:</div>
          <select className="w-full h-full text-[12px] appearance-none bg-transparent focus:outline-none pr-6 cursor-pointer">
            {options.map(opt => <option key={opt}>{opt}</option>)}
          </select>
          <ChevronDown size={14} className="absolute right-2 top-1.5 text-gray-400 pointer-events-none" />
        </div>
      );
    }

    // 改良的统一样式输入框
    function FormInput({ label, placeholder, required, readOnly, icon, value, onChange }) {
      return (
        <div className="flex flex-col h-full">
          <label className="text-gray-600 mb-1.5 flex items-center h-5">
            {required && <span className="text-red-500 mr-1">*</span>}
            {label}:
          </label>
          <div className="relative flex flex-1">
            <input 
              type="text" 
              placeholder={placeholder} 
              readOnly={readOnly}
              value={value !== undefined ? value : (readOnly ? '' : undefined)}
              onChange={onChange}
              className={`h-[28px] border border-gray-300 rounded-sm px-2 text-xs w-full focus:outline-none ${readOnly ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white focus:border-blue-500'}`}
            />
            {icon && (
              <div className="absolute right-0 top-0 h-full w-8 flex items-center justify-center border-l border-gray-300 bg-gray-50 rounded-r-sm cursor-pointer hover:bg-gray-100">
                {icon}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 改良后支持整体“编号-简称”值录入的带按钮输入框 (强制只读及不可点击状态以满足特定业务场景)
    function FormInputWithBtn({ label, placeholder, required, value }) {
      return (
        <div className="flex flex-col">
          <label className="text-gray-600 mb-1.5 flex items-center h-5">
            {required && <span className="text-red-500 mr-1">*</span>}
            {label}:
          </label>
          <div className="relative flex">
            <input 
              type="text" 
              placeholder={placeholder}
              value={value || ''}
              readOnly
              className="h-[28px] border border-gray-300 rounded-sm px-2 text-xs w-full bg-gray-50 text-gray-500 cursor-not-allowed focus:outline-none truncate"
            />
            <button className="h-[28px] w-8 flex items-center justify-center border border-l-0 border-gray-300 bg-gray-100 text-gray-400 text-xs font-bold rounded-r-sm shrink-0 cursor-not-allowed">
              ...
            </button>
          </div>
        </div>
      );
    }

    function FormSelect({ label, required, value, onChange, options = [] }) {
      return (
        <div className="flex flex-col">
          <label className="text-gray-600 mb-1.5 flex items-center h-5">
            {required && <span className="text-red-500 mr-1">*</span>}
            {label}:
          </label>
          <div className="relative flex">
            <select 
              value={value}
              onChange={onChange}
              className="h-[28px] pl-2 pr-6 border border-gray-300 rounded-sm text-xs w-full appearance-none bg-white focus:outline-none focus:border-blue-500 text-gray-800"
            >
              <option value="" disabled hidden>请选择</option>
              {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
            </select>
            <div className="absolute right-0 top-0 h-full w-7 flex items-center justify-center pointer-events-none border-l border-gray-200 bg-gray-50">
              <ChevronDown size={14} className="text-gray-400" />
            </div>
          </div>
        </div>
      );
    }

    function FormCheckbox({ label, checked, onChange }) {
      return (
        <div className="flex flex-col">
          <label className="text-gray-600 mb-1.5 flex items-center h-5">{label}:</label>
          <div className="h-[28px] flex items-center">
            <input 
              type="checkbox" 
              checked={checked}
              onChange={onChange}
              className="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded cursor-pointer"
            />
          </div>
        </div>
      );
    }

    function AttachmentUploader({ title, initialImages = [] }) {
      const [images, setImages] = useState(initialImages);
      const fileInputRef = useRef(null);

      const handleAddClick = () => {
        fileInputRef.current.click();
      };

      const handleFileChange = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
              setImages(prev => [...prev, { id: Date.now() + Math.random(), src: event.target.result }]);
            };
            reader.readAsDataURL(file);
          }
        });
        e.target.value = null;
      };

      const removeImage = (id) => {
        setImages(images.filter(img => img.id !== id));
      };

      return (
        <div className="flex flex-col">
           <div className="text-gray-700 font-medium mb-3">{title}</div>
           <div className="flex items-center flex-wrap gap-3 mb-2">
              {images.map(img => (
                <div key={img.id} className="relative w-[52px] h-[52px] border border-gray-300 bg-white rounded-sm flex items-center justify-center group overflow-hidden">
                  <img src={img.src} alt="preview" className="w-full h-full object-cover" />
                  <div 
                    onClick={() => removeImage(img.id)}
                    className="absolute -top-1.5 -right-1.5 w-[16px] h-[16px] bg-red-500 rounded-full flex items-center justify-center cursor-pointer hover:bg-red-600 text-white z-20 opacity-0 group-hover:opacity-100 transition-opacity"
                  >
                    <X size={10} />
                  </div>
                </div>
              ))}
              <div 
                onClick={handleAddClick}
                className="w-[52px] h-[52px] border border-dashed border-gray-400 bg-gray-50 rounded-sm flex items-center justify-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all active:scale-95"
              >
                 <Plus size={24} className="text-gray-400" />
              </div>
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={handleFileChange} 
                className="hidden" 
                accept="image/*"
                multiple 
              />
           </div>
           <div className="text-gray-400 text-[12px] leading-tight">
             建议尺寸800*800像素，<br/>单个图片不能超过20M
           </div>
        </div>
      );
    }

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
