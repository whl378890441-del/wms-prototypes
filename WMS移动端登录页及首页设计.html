    body {
      background-color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tap-active:active { transform: scale(0.98); transition: transform 0.1s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade { animation: fadeIn 0.2s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.3s cubic-bezier(0.1, 1, 0.1, 1) forwards; }
    .animate-scale { animation: scaleIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    #prototype-container {
      width: 100%;
      height: 100vh;
      max-width: 414px;
      max-height: 926px;
      background-color: #FFFFFF;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 415px) {
      #prototype-container { height: 92vh; border-radius: 20px; }
    }

    /* === PRD Mode CSS === */
    @keyframes prdPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.7); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(255, 149, 0, 0); }
    }
    .rich-text-content ul { list-style-type: disc; padding-left: 1.2rem; margin: 0.3em 0; }
    .rich-text-content ol { list-style-type: decimal; padding-left: 1.2rem; margin: 0.3em 0; }
    .rich-text-content b, .rich-text-content strong { font-weight: 700; color: #111; }
    .rich-text-content i, .rich-text-content em { font-style: italic; }
    .rich-text-content p { margin-bottom: 0.3em; }
    .rich-text-content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
    .rich-text-content th, .rich-text-content td { border: 1px solid #D1D5DB; padding: 6px 8px; text-align: left; min-width: 50px; word-break: break-all; }
    .rich-text-content th { background-color: #F3F4F6; font-weight: 600; }
    .prd-badge { animation: prdPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .badge-pill-scroll { overflow-x: auto; flex: 1; display: flex; gap: 6px; scrollbar-width: none; -ms-overflow-style: none; }
    .badge-pill-scroll::-webkit-scrollbar { display: none; }
    .badge-arrow { width: 20px; height: 24px; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 14px; flex-shrink: 0; cursor: pointer; transition: color 0.15s; }
    .badge-arrow:hover { color: #374151; }
    .badge-arrow.hidden { visibility: hidden; pointer-events: none; }
    .badge-pill { padding: 4px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; flex-shrink: 0; cursor: pointer; background: #f3f4f6; color: #374151; border: 1.5px solid transparent; transition: all 0.15s; }
    .badge-pill:hover { background: #e5e7eb; }
    .badge-pill.active { background: #fa8c16; color: #fff; border-color: #fa8c16; }

    body.prd-resizing { cursor: col-resize !important; user-select: none; }
    body.prd-resizing * { cursor: col-resize !important; }
    .fade-in { animation: fadeIn 0.2s ease-in forwards; }

  },
  "settings-list-area": {

    "title": "规则⑦ 系统设置页",
    "content": "<h4>配置项列表</h4><table><thead><tr><th>字段</th><th>字段类型</th><th>必填</th><th>默认值</th><th>可编辑</th><th>业务规则</th><th>交互逻辑</th><th>取值来源</th></tr></thead><tbody><tr><td>装箱自动暂存间隔</td><td>整数(秒)</td><td>是</td><td>15</td><td>是</td><td>最小值为15秒</td><td>点击弹出数字输入弹窗</td><td>系统配置/用户输入</td></tr><tr><td>上架自动暂存间隔</td><td>整数(秒)</td><td>是</td><td>15</td><td>是</td><td>最小值为15秒</td><td>点击弹出数字输入弹窗</td><td>系统配置/用户输入</td></tr><tr><td>下架自动暂存间隔</td><td>整数(秒)</td><td>是</td><td>15</td><td>是</td><td>最小值为15秒</td><td>点击弹出数字输入弹窗</td><td>系统配置/用户输入</td></tr></tbody></table><h4>输入弹窗规则</h4><table><thead><tr><th>规则项</th><th>说明</th></tr></thead><tbody><tr><td>输入方式</td><td>数字输入框</td></tr><tr><td>最小值</td><td>15</td></tr><tr><td>校验规则</td><td>输入值小于15时自动修正为15；为空时默认15</td></tr><tr><td>保存方式</td><td>点击「确定」即时保存</td></tr></tbody></table>"

  "bottom-tab-bar": {

    "title": "规则⑧ 通用组件",
    "content": "<h4>底部Tab导航</h4><table><thead><tr><th>Tab</th><th>图标</th><th>对应页面</th></tr></thead><tbody><tr><td>首页</td><td>layout-grid</td><td>工作台</td></tr><tr><td>作业</td><td>box</td><td>全部作业</td></tr><tr><td>库存</td><td>database</td><td>库存查询</td></tr><tr><td>我的</td><td>user</td><td>个人中心</td></tr></tbody></table><table><thead><tr><th>规则项</th><th>说明</th></tr></thead><tbody><tr><td>展示范围</td><td>仅在首页、作业、库存、我的四个页面展示</td></tr><tr><td>隐藏范围</td><td>登录页、渠道选择页、系统设置页不展示</td></tr><tr><td>选中态</td><td>当前Tab的图标和文字变为主色</td></tr><tr><td>未选中态</td><td>图标和文字为灰色</td></tr></tbody></table><h4>Toast提示规则</h4><table><thead><tr><th>规则项</th><th>说明</th></tr></thead><tbody><tr><td>展示位置</td><td>屏幕底部居中，Tab栏上方</td></tr><tr><td>展示时长</td><td>约2.2秒后自动消失</td></tr><tr><td>类型</td><td>success（绿色）、error（红色）、warning（橙色）、default（深灰）</td></tr><tr><td>展示形式</td><td>圆角条，白色文字</td></tr></tbody></table>"
  }
}</script>

  <div id="prototype-container">
    <!-- React 挂载点 -->
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useLayoutEffect, useContext } = React;

    // === 安全的 Lucide 图标包装器 ===
    const Icon = ({ name, className }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.className = className;
          iconRef.current.appendChild(i);
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} className={`inline-flex items-center justify-center ${className || ''}`}></span>;
    };

    // ==========================================
    // PRD 模式组件区
    // ==========================================
    const INITIAL_PRD_DOCS = JSON.parse(document.getElementById('prd-embedded-data')?.textContent || '{}');

    const DraggablePRDMenu = ({ isPrdMode, setIsPrdMode, importPrdData, exportPrdData, embedSave, showToast }) => {
      const [position, setPosition] = useState({ x: -1000, y: -1000 });
      const [isReady, setIsReady] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const dragRef = useRef({ startX: 0, startY: 0, initX: 0, initY: 0, hasMoved: false });

      useEffect(() => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        setPosition({ x: Math.max(10, w - 75), y: Math.max(10, h - 150) });
        setIsReady(true);
      }, []);

      const handlePointerDown = (e) => {
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current = { startX: e.clientX, startY: e.clientY, initX: position.x, initY: position.y, hasMoved: false };
      };

      const handlePointerMove = (e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
        const dx = e.clientX - dragRef.current.startX;
        const dy = e.clientY - dragRef.current.startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          dragRef.current.hasMoved = true;
          if (!isDragging) setIsDragging(true);
        }
        if (dragRef.current.hasMoved) {
          let newX = dragRef.current.initX + dx;
          let newY = dragRef.current.initY + dy;
          newX = Math.max(0, Math.min(newX, window.innerWidth - 52));
          newY = Math.max(0, Math.min(newY, window.innerHeight - 52));
          setPosition({ x: newX, y: newY });
        }
      };

      const handlePointerUp = (e) => {
        e.currentTarget.releasePointerCapture(e.pointerId);
        setTimeout(() => setIsDragging(false), 10);
      };

      const handleClick = (e) => {
        if (dragRef.current.hasMoved) { e.stopPropagation(); e.preventDefault(); return; }
        setIsPrdMode(!isPrdMode);
        if (showToast) showToast(isPrdMode ? 'PRD 模式已关闭' : 'PRD 模式已开启', 'success');
      };

      useEffect(() => {
        const handleResize = () => setPosition(prev => ({
          x: Math.max(0, Math.min(prev.x, window.innerWidth - 52)),
          y: Math.max(0, Math.min(prev.y, window.innerHeight - 52))
        }));
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      if (!isReady) return null;

      return ReactDOM.createPortal(
        <div className="fixed z-[9999] flex flex-col items-center gap-3 transition-opacity" style={{ left: `${position.x}px`, top: `${position.y}px`, touchAction: 'none' }}>
          <div className={`flex items-center justify-center w-[52px] h-[52px] bg-white rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.2)] border-2 ${isPrdMode ? 'border-[#FF9500]' : 'border-transparent'} cursor-pointer select-none transition-transform ${isDragging ? 'scale-95 opacity-90' : 'hover:scale-105'}`}
            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
            onClick={handleClick} title={isPrdMode ? "关闭 PRD 模式" : "开启 PRD 模式"}>
            <i className={`ph-fill ${isPrdMode ? 'ph-notebook text-[#FF9500]' : 'ph-notebook text-[#808592]'} text-[26px] pointer-events-none`}></i>
          </div>
          {isPrdMode && (
            <div className="flex flex-col gap-2 fade-in" onPointerDown={e => e.stopPropagation()}>
              <label className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#3C5BF2] hover:scale-105 transition-transform" title="导入 PRD 配置文件">
                <i className="ph-fill ph-download-simple text-[20px]"></i>
                <input type="file" accept=".json" className="hidden" onChange={importPrdData} />
              </label>
              <div className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#34C759] hover:scale-105 transition-transform" title="导出 PRD 配置文件" onClick={exportPrdData}>
                <i className="ph-fill ph-upload-simple text-[20px]"></i>
              </div>
              <div className="flex items-center justify-center w-[40px] h-[40px] bg-white rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.15)] border border-[#E8E8E8] cursor-pointer text-[#FF9500] hover:scale-105 transition-transform" title="嵌入保存（直接覆盖原HTML文件）" onClick={embedSave}>
                <i className="ph-fill ph-floppy-disk text-[20px]"></i>
              </div>
            </div>
          )}
        </div>,
        document.body
      );
    };

    const RichTextEditor = ({ value, onChange, activeId }) => {
      const editorRef = useRef(null);
      useEffect(() => { if (editorRef.current && editorRef.current.innerHTML !== value) editorRef.current.innerHTML = value || ''; }, [activeId]);
      const handleInput = () => { if (editorRef.current) onChange(editorRef.current.innerHTML); };
      const execCmd = (cmd, arg = null) => { document.execCommand(cmd, false, arg); editorRef.current.focus(); handleInput(); };
      const insertTable = () => {
        editorRef.current.focus();
        document.execCommand('insertHTML', false, `<table style="width: 100%; border-collapse: collapse;"><tbody><tr><td>表头1</td><td>表头2</td></tr><tr><td>内容</td><td>内容</td></tr></tbody></table><p><br></p>`);
        handleInput();
      };
      const getCell = () => {
        const sel = window.getSelection(); if (!sel.rangeCount) return null;
        let n = sel.anchorNode; while (n && n !== editorRef.current) { if (n.nodeType === 1 && (n.tagName === 'TD' || n.tagName === 'TH')) return n; n = n.parentNode; }
        return null;
      };
      const insertRow = (above) => {
        const cell = getCell(); if (!cell) return;
        const row = cell.parentElement; const tbody = row.parentElement; const newRow = row.cloneNode(true);
        newRow.querySelectorAll('td,th').forEach(c => { c.innerHTML = ''; });
        above ? tbody.insertBefore(newRow, row) : tbody.insertBefore(newRow, row.nextSibling); handleInput();
      };
      const insertCol = (left) => {
        const cell = getCell(); if (!cell) return; const idx = Array.from(cell.parentElement.children).indexOf(cell);
        cell.closest('table').querySelectorAll('tr').forEach(tr => {
          const ref = tr.children[idx]; const newCell = ref ? ref.cloneNode(true) : document.createElement('td'); newCell.innerHTML = '';
          left && ref ? tr.insertBefore(newCell, ref) : tr.appendChild(newCell);
        }); handleInput();
      };
      const deleteRow = () => {
        const cell = getCell(); if (!cell) return; const row = cell.parentElement; const tbody = row.parentElement;
        if (tbody.children.length <= 1) return; row.remove(); handleInput();
      };
      const deleteCol = () => {
        const cell = getCell(); if (!cell) return; const idx = Array.from(cell.parentElement.children).indexOf(cell);
        const table = cell.closest('table'); table.querySelectorAll('tr').forEach(tr => { if (tr.children[idx]) tr.children[idx].remove(); });
        handleInput();
      };

      return (
        <div className="border border-[#E8E8E8] rounded-lg overflow-hidden flex flex-col flex-1 bg-white shadow-sm">
          <div className="flex items-center gap-1.5 p-1.5 border-b border-[#E8E8E8] bg-[#F9FAFB] flex-shrink-0 flex-wrap">
            <button onClick={() => execCmd('bold')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="加粗"><b className="font-serif text-[15px]">B</b></button>
            <button onClick={() => execCmd('italic')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="斜体"><i className="font-serif text-[15px]">I</i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={() => execCmd('insertUnorderedList')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="无序列表"><i className="ph ph-list-bullets text-[16px]"></i></button>
            <button onClick={() => execCmd('insertOrderedList')} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="有序列表"><i className="ph ph-list-numbers text-[16px]"></i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={insertTable} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors" title="插入表格"><i className="ph ph-table text-[16px]"></i></button>
            <div className="w-px h-5 bg-[#E8E8E8] mx-1"></div>
            <button onClick={() => insertRow(true)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="上方插入行">+↑</button>
            <button onClick={() => insertRow(false)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="下方插入行">+↓</button>
            <button onClick={() => insertCol(true)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="左侧插入列">+←</button>
            <button onClick={() => insertCol(false)} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#353D51] transition-colors text-[11px] font-bold" title="右侧插入列">+→</button>
            <button onClick={deleteRow} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#EF4444] transition-colors text-[11px] font-bold" title="删除当前行">-行</button>
            <button onClick={deleteCol} className="w-8 h-8 flex items-center justify-center rounded hover:bg-[#E8E8E8] text-[#EF4444] transition-colors text-[11px] font-bold" title="删除当前列">-列</button>
          </div>
          <div ref={editorRef} className="flex-1 p-3 outline-none overflow-y-auto text-[14px] leading-relaxed rich-text-content text-[#353D51]"
            contentEditable onInput={handleInput} style={{ minHeight: '180px' }} />
        </div>
      );
    };

    const PrdContext = React.createContext();

    const PrdBadge = ({ order, anchorRef }) => {
      const [pos, setPos] = useState(null);
      useEffect(() => {
        const update = () => {
          const el = anchorRef?.current; if (!el) return;
          const rect = el.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) setPos({ x: rect.right - 10, y: rect.top - 10 });
        };
        update();
        const timer = setTimeout(update, 100);
        window.addEventListener('scroll', update, true); window.addEventListener('resize', update);
        return () => { clearTimeout(timer); window.removeEventListener('scroll', update, true); window.removeEventListener('resize', update); };
      }, [anchorRef]);

      if (!pos) return null;
      return ReactDOM.createPortal(
        <div className="fixed w-[22px] h-[22px] bg-[#FF9500] text-white text-[11px] font-bold rounded-full flex items-center justify-center shadow-[0_2px_6px_rgba(255,149,0,0.5)] z-[9998] pointer-events-none prd-badge"
          style={{ left: `${pos.x}px`, top: `${pos.y}px` }}>{order}</div>, document.body
      );
    };

    const PrdWrapper = ({ id, children, className = "" }) => {
      const { prdDocs, isPrdMode, openPrdDrawer, drawerOpen } = useContext(PrdContext);
      const anchorRef = useRef(null);
      const docData = prdDocs[id];
      const hasContent = docData && (docData.title || docData.content);

      if (!isPrdMode) return <div className={className}>{children}</div>;

      return (
        <div ref={anchorRef} className={`relative ring-2 ring-transparent hover:ring-[#FF9500] transition-all rounded-lg cursor-pointer ${className}`}
          onClickCapture={(e) => { e.preventDefault(); e.stopPropagation(); openPrdDrawer(id); }}>
          {/* 去除原本阻止滚动的 absolute inset-0 遮罩层，完全依赖 onClickCapture 拦截交互事件，保护滚动条体验 */}
          {children}
          {hasContent && !drawerOpen && <PrdBadge order={docData.order} anchorRef={anchorRef} />}
        </div>
      );
    };

    const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
    const BadgePillBar = ({ badges, activeId, onSelect, scrollRef }) => {
      const scrollContainerRef = useRef(null);
      const [showLeft, setShowLeft] = useState(false);
      const [showRight, setShowRight] = useState(false);
      const checkOverflow = () => {
        const el = scrollContainerRef.current; if (!el) return;
        setShowLeft(el.scrollLeft > 2);
        setShowRight(el.scrollWidth > el.clientWidth && el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
      };
      useEffect(() => { checkOverflow(); }, [badges]);
      const scroll = (dir) => {
        const el = scrollContainerRef.current; if (!el) return;
        el.scrollBy({ left: dir * 120, behavior: 'smooth' });
        setTimeout(checkOverflow, 200);
      };
      useEffect(() => { if (scrollRef) scrollRef.current = scrollContainerRef.current; }, []);

      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '8px 16px', background: '#fff', borderBottom: '1px solid #e5e7eb', flexShrink: 0 }}>
          <div className={`badge-arrow ${showLeft ? '' : 'hidden'}`} onClick={() => scroll(-1)}>◀</div>
          <div ref={scrollContainerRef} className="badge-pill-scroll" onScroll={checkOverflow}>
            {badges.map(b => (
              <div key={b.id} className={`badge-pill ${b.id === activeId ? 'active' : ''}`} onClick={() => onSelect(b.id)}>

          try {
            const imported = JSON.parse(e.target.result);
            if (typeof imported === 'object' && imported !== null) {
              setPrdDocs(imported); showToast('PRD 数据导入成功', 'success');
            } else { showToast('无效的数据文件格式', 'error'); }
          } catch (error) { showToast('文件解析失败', 'error'); }
        };
        reader.readAsText(file); event.target.value = null;
      };

      const openPrdDrawer = (id) => {
        setActivePrdId(id); setIsConfirmingDelete(false); setShowDiscardConfirm(false);
        if (prdDocs[id]) { setEditingDoc({ ...prdDocs[id] }); setIsEditing(false); }
        else {
          const orders = Object.values(prdDocs).map(d => d.order);
          setEditingDoc({ order: orders.length > 0 ? Math.max(...orders) + 1 : 1, title: '', content: '' });
          setIsEditing(true);
        }
        setDrawerOpen(true);
      };

        if (!editingDoc) return false;
        const existing = prdDocs[activePrdId];
        return !existing || existing.title !== editingDoc.title || existing.content !== editingDoc.content;
      };

      const closePrdDrawer = () => {
        if (isEditing && hasUnsavedChanges()) { setShowDiscardConfirm(true); return; }
        setDrawerOpen(false); setIsEditing(false); setShowDiscardConfirm(false); setIsConfirmingDelete(false);
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

        setDrawerOpen(false); setIsEditing(false); setShowDiscardConfirm(false); setIsConfirmingDelete(false);
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

      const executeDelete = () => {
        let nd = { ...prdDocs }; delete nd[activePrdId];
        let c = 1; const sorted = Object.keys(nd).sort((a, b) => nd[a].order - nd[b].order);
        const rebuilt = {}; sorted.forEach(k => { rebuilt[k] = { ...nd[k], order: c++ }; });
        setPrdDocs(rebuilt); setIsConfirmingDelete(false); showToast('已删除该角标说明', 'success');
        if (sorted.length > 0) {
          const nextId = sorted[0];
          setActivePrdId(nextId); setEditingDoc({ ...rebuilt[nextId] }); setIsEditing(false);
        } else {
          setDrawerOpen(false); setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
        }
      };

      const confirmPrdSave = () => {
        let nd = { ...prdDocs };
        if (!editingDoc.title?.trim() && !editingDoc.content?.trim()) {
          delete nd[activePrdId];
          let c = 1; const sorted = Object.keys(nd).sort((a, b) => nd[a].order - nd[b].order);
          const rebuilt = {}; sorted.forEach(k => { rebuilt[k] = { ...nd[k], order: c++ }; }); nd = rebuilt;
        } else { nd[activePrdId] = editingDoc; }
        setPrdDocs(nd);
        setDrawerOpen(false); setIsEditing(false); showToast('保存成功，请点击悬浮球【嵌入保存】以固化到文件', 'success');
        setTimeout(() => { setActivePrdId(null); setEditingDoc(null); }, 300);
      };

      const embedSave = async () => {
        if (typeof window.showOpenFilePicker !== 'function') { showToast('当前浏览器不支持直接覆盖，请使用导出功能', 'error'); return; }
        try {
          const [fileHandle] = await window.showOpenFilePicker({ types: [{ description: 'HTML 文件', accept: { 'text/html': ['.html', '.htm'] } }], multiple: false });
          const file = await fileHandle.getFile(); const fileContent = await file.text();
          const jsonStartTag = '<script type="application/json" id="prd-embedded-data">';
          const jsonEndTag = '<' + '/script>';
          let jsonStart = -1; let searchPos = 0;
          while (true) {
            const idx = fileContent.indexOf(jsonStartTag, searchPos); if (idx === -1) break;
            const afterTag = fileContent.substring(idx + jsonStartTag.length, idx + jsonStartTag.length + 10).trim();
            if (afterTag.startsWith('{')) { jsonStart = idx; break; } searchPos = idx + 1;
          }
          if (jsonStart === -1) { showToast('选中文件缺少 PRD 嵌入区', 'error'); return; }
          const jsonEnd = fileContent.indexOf(jsonEndTag, jsonStart);
          if (jsonEnd === -1) { showToast('PRD 嵌入区格式异常', 'error'); return; }
          const jsonStr = JSON.stringify(prdDocs, null, 2);
          const before = fileContent.substring(0, jsonStart + jsonStartTag.length);
          const after = fileContent.substring(jsonEnd);
          const newContent = before + '\n' + jsonStr + '\n' + after;
          const writable = await fileHandle.createWritable();
          await writable.write(newContent); await writable.close();
          showToast('原文件已成功覆盖更新', 'success');
        } catch (error) {
          if (error.name !== 'AbortError') showToast('嵌入保存失败: ' + error.message, 'error');

          setIsResizing(false); document.body.classList.remove('prd-resizing');

          )}

          {/* ========================================================= */}
          {/* 业务 Modals，遮罩层外，包裹内容区供 PRD 模式使用           */}
          {/* ========================================================= */}
          
          {/* 渠道切换抽屉 */}
          {drawerType === 'channels' && (
            <div className="absolute inset-0 bg-black/40 z-40 animate-fade flex flex-col justify-end">
              <div className="absolute inset-0" onClick={() => setDrawerType(null)}></div>
              <PrdWrapper id="channel-drawer" className="relative z-50 bg-[#FFFFFF] rounded-t-[20px] p-5 max-h-[85%] flex flex-col animate-slideUp">
                <div className="flex items-center justify-between pb-4 border-b border-border-default">
                  <span className="text-[16px] font-bold">切换操作渠道</span>
                  <button onClick={() => setDrawerType(null)}><Icon name="x" className="w-6 h-6 text-text-secondary" /></button>
                </div>
                <div className="overflow-y-auto no-scrollbar py-4 space-y-3">
                  {INITIAL_CHANNELS.map((ch) => {
                    const isCurrent = selectedChannel?.code === ch.code;
                    return (
                      <div key={ch.code} onClick={() => { 
                          handleSelectChannel(ch); setDrawerType(null); setInventorySearch(''); setDisplayedInventoryCount(15);
                          showToast(`已切换至: ${ch.name.split('-')[1]}`, 'success'); 
                        }} 
                        className={`px-4 py-3 h-[68px] rounded-xl flex items-center justify-between border ${isCurrent ? 'bg-primary-light_five border-primary text-primary' : 'border-border-default'}`}>
                        <span className="text-[15px] font-bold">{ch.name}</span>
                        {isCurrent && <Icon name="check" className="w-5 h-5 text-primary" />}
                      </div>
                    );
                  })}
                </div>
              </PrdWrapper>
            </div>
          )}

          {/* 指标明细抽屉 */}
          {drawerType === 'metrics' && activeMetricDetail && (
            <div className="absolute inset-0 bg-black/40 z-40 animate-fade flex flex-col justify-end">
              <div className="absolute inset-0" onClick={() => setDrawerType(null)}></div>
              <PrdWrapper id="metrics-drawer" className="relative z-50 bg-[#F5F5F7] rounded-t-[20px] flex flex-col max-h-[90%] h-[85%] animate-slideUp">
                <div className="bg-[#FFFFFF] p-4 rounded-t-[20px] flex items-center justify-between border-b border-border-default shrink-0">
                  <span className="text-[16px] font-bold">{activeMetricDetail.title} 明细</span>
                  <button onClick={() => setDrawerType(null)}><Icon name="x" className="w-6 h-6 text-text-secondary" /></button>
                </div>
                <div className="bg-[#FFFFFF] flex overflow-x-auto no-scrollbar border-b border-border-default shrink-0">
                  {activeMetricDetail.group.map((g, idx) => (
                    <button key={idx}
                      onClick={() => { setActiveTabIdx(idx); setDisplayedTasks(generateTasksForTab(activeMetricDetail.title, g.label, Math.min(15, g.val), 0)); }}
                      className={`px-4 py-3 text-[14px] font-bold border-b-2 whitespace-nowrap transition-colors ${activeTabIdx === idx ? 'text-primary border-primary' : 'text-text-secondary border-transparent'}`}
                    >
                      {g.label}({g.val})
                    </button>
                  ))}
                </div>
                <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3" onScroll={handleTaskScroll}>
                  {displayedTasks.map(task => (
                    <div key={task.id} onClick={() => { setDrawerType(null); showToast(`即将前往处理：${task.title}`, 'success'); }} className="bg-[#FFFFFF] rounded-xl p-4 shadow-sm border border-border-default hover:border-primary cursor-pointer tap-active">
                      <div className="flex justify-between items-start mb-2">
                        <span className="text-[14px] font-bold text-text-primary leading-tight flex-1 pr-2 truncate">{task.title}</span>
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded-md shrink-0 bg-primary-light text-primary">{task.status}</span>
                      </div>
                      <div className="flex items-center gap-1 text-[12px] text-text-secondary">
                        <Icon name="clock" className="w-3.5 h-3.5" />
                        <span>{task.time}</span>
                      </div>
                    </div>
                  ))}
                  <div className="py-4 flex justify-center items-center">
                    <span className="text-[12px] text-text-secondary">
                      {isLoadingMore ? <span className="flex items-center gap-1"><Icon name="loader" className="w-3.5 h-3.5 animate-spin" /> 加载中...</span> 
                                    : (displayedTasks.length >= activeMetricDetail.group[activeTabIdx].val ? '已加载全部' : '上滑加载更多')}
                    </span>
                  </div>
                </div>
              </PrdWrapper>
            </div>
          )}

          {/* 快捷配置抽屉 */}
          {drawerType === 'shortcuts_cfg' && (
            <div className="absolute inset-0 bg-black/40 z-40 animate-fade flex flex-col justify-end">
              <div className="absolute inset-0" onClick={() => setDrawerType(null)}></div>
              <PrdWrapper id="shortcuts-cfg-drawer" className="relative z-50 bg-[#F5F5F7] rounded-t-[20px] flex flex-col max-h-[90%] animate-slideUp">
                <div className="bg-[#FFFFFF] p-4 rounded-t-[20px] flex items-center justify-between shadow-sm z-10 shrink-0">
                  <div>
                    <span className="text-[16px] font-bold block">配置快捷作业</span>
                    <span className="text-[12px] text-text-secondary">已选 {tempShortcutIds.length}/4 项</span>
                  </div>
                  <button onClick={() => setDrawerType(null)}><Icon name="x" className="w-6 h-6 text-text-secondary" /></button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-6">
                  <div>
                    <span className="text-[13px] font-bold text-text-secondary mb-3 block">当前工作台显示 (支持拖动顺序)</span>
                    <div className="grid grid-cols-2 gap-3">
                      {tempShortcutIds.length === 0 ? (
                        <div className="col-span-2 py-6 text-center text-[13px] text-text-secondary border border-dashed border-border-default rounded-xl bg-[#FFFFFF] flex flex-col items-center justify-center gap-2">
                          <Icon name="info" className="w-5 h-5 text-text-disabled" />
                          <span>暂无选中的快捷作业（保存后将在首页隐藏快捷看板）</span>
                        </div>
                      ) : (
                        tempShortcutIds.map((id, index) => {
                          const j = ALL_JOBS.find(x => x.id === id);
                          return (
                            <div 
                              key={id} draggable onDragStart={() => setDraggedItem(index)} onDragOver={(e) => e.preventDefault()}
                              onDrop={() => {
                                if (draggedItem === null) return;
                                const updated = [...tempShortcutIds];
                                const temp = updated[draggedItem];
                                updated[draggedItem] = updated[index]; updated[index] = temp;
                                setTempShortcutIds(updated); setDraggedItem(null);
                              }}
                              className="bg-[#FFFFFF] p-3 rounded-xl border border-primary text-primary flex items-center justify-between h-[68px]"
                            >
                              <span className="text-[14px] font-bold">{j?.name}</span>
                              <button onClick={() => setTempShortcutIds(prev => prev.filter(x => x !== id))}>
                                <Icon name="minus-circle" className="w-5 h-5" />
                              </button>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                  <div>
                    <span className="text-[13px] font-bold text-text-secondary mb-3 block">可选作业</span>
                    <div className="grid grid-cols-2 gap-3">
                      {ALL_JOBS.map((job) => {
                        const isSelected = tempShortcutIds.includes(job.id);
                        if (isSelected) return null;
                        const disabled = tempShortcutIds.length >= 4;
                        return (
                          <button key={job.id} disabled={disabled} onClick={() => toggleShortcutSelection(job.id)}
                            className={`bg-[#FFFFFF] p-3 rounded-xl text-[14px] font-medium text-left flex items-center justify-between h-[68px] ${disabled ? 'opacity-50' : ''}`}
                          >
                            {job.name} <Icon name="plus-circle" className="w-5 h-5 text-text-secondary" />
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
                <div className="bg-[#FFFFFF] p-4 shrink-0 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
                  <button onClick={saveShortcutConfig} className="w-full h-[44px] bg-primary text-white text-[15px] font-bold rounded-xl">保 存</button>
                </div>
              </PrdWrapper>
            </div>
          )}

          {/* 文本输入交互浮窗 */}
          {inputModal.show && (
            <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-6 animate-fade">
              <PrdWrapper id="settings-input-modal" className="relative z-10 w-[280px]">
                <div className="bg-[#FFFFFF] rounded-xl overflow-hidden animate-scale w-full">
                  <div className="p-6">
                    <h4 className="text-[15px] font-bold text-text-primary mb-4">{inputModal.title}</h4>
                    <input 
                      type="number" 
                      value={inputModal.value}
                      onChange={(e) => setInputModal({...inputModal, value: e.target.value})}
                      placeholder="最小15s"
                      className="w-full text-[14px] text-text-primary border-b border-border-default pb-2 focus:outline-none focus:border-primary transition-colors bg-transparent"
                      autoFocus
                    />
                  </div>
                  <div className="flex border-t border-border-default h-[44px]">
                    <button onClick={() => setInputModal({ show: false, key: '', title: '', value: '' })} className="flex-1 text-[14px] border-r border-border-default text-text-primary hover:bg-bg-light">取消</button>
                    <button onClick={() => {
                        const finalValue = parseInt(inputModal.value) < 15 ? '15' : (inputModal.value || '15');
                        setSettings({...settings, [inputModal.key]: finalValue});
                        setInputModal({ show: false, key: '', title: '', value: '' });
                        showToast('设置已保存', 'success');
                      }} 
                      className="flex-1 text-[14px] text-primary hover:bg-bg-light"
                    >确定</button>
                  </div>
                </div>
              </PrdWrapper>
            </div>
          )}

          {/* 退出确认对话框 */}
          {dialog.show && (
            <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-6 animate-fade">
              <PrdWrapper id="global-dialog-modal" className="relative z-10 w-[280px]">
                <div className="bg-[#FFFFFF] w-full rounded-2xl overflow-hidden animate-scale">
                  <div className="p-6 text-center">
                    <h4 className="text-[18px] font-bold mb-2">{dialog.title}</h4>
                    <p className="text-[14px] text-text-secondary">{dialog.content}</p>
                  </div>
                  <div className="flex border-t border-border-default h-[50px]">
                    <button onClick={() => setDialog({ show: false })} className="flex-1 text-[16px] border-r border-border-default text-text-primary">取消</button>
                    <button onClick={dialog.onConfirm} className="flex-1 text-[16px] font-bold text-primary">确定</button>
                  </div>
                </div>
              </PrdWrapper>
            </div>
          )}

          {/* Toast */}
          {toast.show && (
            <div className="absolute inset-x-0 bottom-24 flex justify-center z-50 animate-fade pointer-events-none">
              <div className={`px-4 py-2.5 rounded-lg shadow-lg text-[14px] font-bold flex items-center gap-2 ${toast.type === 'error' ? 'bg-status-error text-white' : toast.type === 'warning' ? 'bg-status-warning text-white' : toast.type === 'success' ? 'bg-status-success text-white' : 'bg-text-primary text-white'}`}>
                <span>{toast.text}</span>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* PRD 编辑器侧边抽屉 Portal                                 */}
          {/* ========================================================= */}
          {ReactDOM.createPortal(
            <>
              <div className={`fixed inset-0 bg-black/40 z-[9990] transition-opacity duration-300 ${drawerOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                onClick={closePrdDrawer}></div>
              <div className={`fixed right-0 top-0 bottom-0 bg-[#F5F5F7] shadow-2xl z-[9995] transition-transform duration-300 transform flex flex-col ${drawerOpen ? 'translate-x-0' : 'translate-x-full'}`}
                style={{ width: `${prdDrawerWidth}px`, maxWidth: '90vw' }}>
                
                {/* 拖拽拉伸条 */}
                <div className="absolute left-0 top-0 bottom-0 w-1.5 cursor-col-resize z-10 hover:bg-[#FF9500] hover:opacity-60 transition-opacity group"
                  onMouseDown={startResize}>
                  <div className="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1 w-1 h-12 bg-gray-300 rounded-full group-hover:bg-[#FF9500] transition-colors"></div>
                </div>
                
                {/* 顶部栏 */}
                <div className="px-6 py-4 border-b border-[#E8E8E8] bg-white flex items-center justify-between flex-shrink-0">
                  <span className="text-[18px] font-semibold text-[#333]">产品规则说明</span>
                  <div className="w-8 h-8 rounded-full bg-[#F5F5F7] flex items-center justify-center cursor-pointer active:scale-95 hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>
                    <i className="ph ph-x text-[16px] text-[#666]"></i>
                  </div>
                </div>

                {/* Badge Pill Switch Bar */}
                <BadgePillBar
                  badges={Object.keys(prdDocs).map(id => ({ id, order: prdDocs[id].order })).sort((a, b) => a.order - b.order)}
                  activeId={activePrdId}
                  onSelect={(id) => {
                    setActivePrdId(id); setIsConfirmingDelete(false); setShowDiscardConfirm(false);
                    if (prdDocs[id]) { setEditingDoc({ ...prdDocs[id] }); setIsEditing(false); }
                  }}
                  scrollRef={badgePillScrollRef}
                />

                {/* 内容编辑区 */}
                <div className="flex-1 p-6 overflow-y-auto flex flex-col gap-6">
                  {/* 标题 */}
                  <div className="flex flex-col gap-2 flex-shrink-0">
                    <label className="text-[14px] font-medium text-[#808592] ml-1">功能模块名称</label>
                    {isEditing ? (
                      <input className="px-4 py-3 text-[15px] border border-[#E8E8E8] rounded-xl outline-none focus:border-[#FF9500] focus:ring-2 focus:ring-[rgba(255,149,0,0.1)] bg-white font-medium text-[#353D51] transition-all"
                        value={editingDoc?.title || ''} onChange={e => handlePrdChange('title', e.target.value)} />
                    ) : (
                      <div className="px-4 py-3 text-[15px] border border-[#E8E8E8] rounded-xl bg-white font-medium text-[#353D51] min-h-[48px]">
                        {editingDoc?.title || '未命名'}
                      </div>
                    )}
                  </div>
                  {/* 富文本内容 */}
                  <div className="flex flex-col gap-2 flex-1 min-h-[300px]">
                    <label className="text-[14px] font-medium text-[#808592] ml-1">交互与规则说明（富文本）</label>
                    {isEditing ? (
                      <RichTextEditor value={editingDoc?.content || ''} onChange={val => handlePrdChange('content', val)} activeId={activePrdId} />
                    ) : (
                      <div className="flex-1 p-3 border border-[#E8E8E8] rounded-lg bg-white shadow-sm overflow-y-auto rich-text-content text-[14px] leading-relaxed text-[#353D51]"
                        dangerouslySetInnerHTML={{ __html: editingDoc?.content || '' }} />
                    )}
                  </div>
                </div>

                {/* 底部操作区 */}
                <div className="px-6 py-4 border-t border-[#E8E8E8] bg-white flex items-center justify-between flex-shrink-0">
                  {isEditing ? (
                     <>
                       {showDiscardConfirm ? (
                         <div className="flex items-center gap-2 fade-in">
                           <span className="text-[13px] font-medium text-orange-500">有未保存的内容</span>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setShowDiscardConfirm(false)}>返回编辑</button>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={discardChanges}>放弃修改</button>
                         </div>
                       ) : isConfirmingDelete ? (
                         <div className="flex items-center gap-2 fade-in">
                           <span className="text-[13px] font-medium text-[#FF3B30]">确认删除？</span>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setIsConfirmingDelete(false)}>取消</button>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={executeDelete}>删除</button>
                         </div>
                       ) : prdDocs[activePrdId] ? (
                         <button className="flex items-center text-[15px] font-medium text-[#FF3B30] active:scale-95 transition-transform px-2 py-2 rounded-lg hover:bg-[rgba(255,59,48,0.08)]" onClick={() => setIsConfirmingDelete(true)}>
                           <i className="ph-fill ph-trash mr-1.5 text-[18px]"></i> 删除
                         </button>
                       ) : <div></div>}
                       <div className="flex items-center gap-3">
                         <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-[#353D51] bg-[#F5F5F7] hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>取消</button>
                         <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-white shadow-md active:scale-95 transition-transform" style={{ background: '#FF9500' }} onClick={confirmPrdSave}>保存</button>
                       </div>
                     </>
                  ) : (
                     <>
                       {prdDocs[activePrdId] && !isConfirmingDelete ? (
                         <button className="flex items-center text-[15px] font-medium text-[#FF3B30] active:scale-95 transition-transform px-2 py-2 rounded-lg hover:bg-[rgba(255,59,48,0.08)]" onClick={() => setIsConfirmingDelete(true)}>
                           <i className="ph-fill ph-trash mr-1.5 text-[18px]"></i> 删除
                         </button>
                       ) : isConfirmingDelete ? (
                         <div className="flex items-center gap-2 fade-in">
                           <span className="text-[13px] font-medium text-[#FF3B30]">确认删除？</span>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#F5F5F7] hover:bg-[#E8E8E8] text-[#353D51]" onClick={() => setIsConfirmingDelete(false)}>取消</button>
                           <button className="px-3 py-1.5 rounded text-[13px] bg-[#FF3B30] text-white shadow-sm active:scale-95 transition-transform" onClick={executeDelete}>删除</button>
                         </div>
                       ) : <div></div>}
                       <div className="flex items-center gap-3">
                         <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-[#353D51] bg-[#F5F5F7] hover:bg-[#E8E8E8] transition-colors" onClick={closePrdDrawer}>关闭</button>
                         <button className="px-6 py-2.5 rounded-lg text-[15px] font-medium text-white shadow-md active:scale-95 transition-transform" style={{ background: '#FF9500' }} onClick={() => setIsEditing(true)}>
                           <i className="ph-fill ph-note-pencil mr-1 text-[16px]"></i>编辑
                         </button>
                       </div>
                     </>
                  )}
                </div>
              </div>
            </>,
            document.body
          )}

        </div>
        </PrdContext.Provider>
      );
    }

    try {
      const container = document.getElementById('prototype-container');
      if (container) {
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
      }
    } catch (e) {
      document.getElementById('prototype-container').innerHTML = 
        `<div style="padding: 20px; color: red;">组件渲染异常: ${e.message}</div>`;
      console.error("React Render Error:", e);
    }
  </script>
</body>
</html>
